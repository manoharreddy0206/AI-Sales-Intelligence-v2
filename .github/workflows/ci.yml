name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + stub eval (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Show versions
        run: python -c "import sys, numpy, pandas, sklearn, fastapi; print(sys.version); print('numpy', numpy.__version__, 'pandas', pandas.__version__, 'sklearn', sklearn.__version__, 'fastapi', fastapi.__version__)"

      - name: pytest (unit + FastAPI HTTP tests)
        run: python -m pytest -q -rs --junitxml=pytest-report.xml

      # The HTTP test modules use pytest.importorskip("fastapi"), so a broken
      # install would skip them silently. In CI every test must actually run.
      - name: Fail if any test was skipped
        run: |
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped}")
          sys.exit(1 if skipped or tests == 0 else 0)
          EOF

      - name: Copilot eval (stub provider, no LLM)
        env:
          COPILOT_PROVIDER: stub
        run: python -m eval.run_eval --out eval-ci-results

      - name: Upload test and eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/pytest-report.xml
            backend/eval-ci-results/

  frontend:
    name: Frontend typecheck + build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker image builds and serves demo
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-sales-intelligence:ci .

      - name: Run in public demo mode and smoke test
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=1 ai-sales-intelligence:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          python3 scripts/smoke_test.py http://127.0.0.1:8000
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F "file=@backend/sample_sales.csv" http://127.0.0.1:8000/api/upload)
          echo "upload in demo mode -> HTTP $code"
          test "$code" = "403"

      - name: Container logs
        if: always()
        run: docker logs app || true
