# Render Blueprint for the public demo (Docker web service).
# Public demo mode seeds the synthetic dataset on start and disables uploads,
# so the container's ephemeral disk is enough; no persistent volume is attached.
services:
  - type: web
    name: ai-sales-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "1"
      # COPILOT_PROVIDER is deliberately unset: the backend uses Anthropic when
      # ANTHROPIC_API_KEY is present and the labelled stub provider when it is not.
      # Forcing "anthropic" without a key made every copilot answer an error.
      - key: COPILOT_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the Render dashboard; never commit it
